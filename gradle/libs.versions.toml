[bundles]

a12-dataservices-core = [
    "a12-dataservices-core",
    "a12-dataservices-core-autoconfig",
]
# CIB 7 bundles
cibseven-base-app = [
    "cibseven-starter",
    "cibseven-starter-rest",
    "cibseven-starter-webapp",
]

graaljs = [
    "graal-js",
    "graal-js-scriptengine",
]

# Libs Bundles
jaxb = [
    "jaxb-api",
    "jaxb-runtime",
    "activation",
]
jsonpath = [
    "json-path",
    "json-standard",
]
kotlin = [
    "kotlin-stdlib",
    "kotlin-reflect",
]
openapi = [
    "spring-rest-docs",
    "openapi-ext",
]

openrewrite = [
    "openrewrite-properties",
    "openrewrite-yaml",
    "openrewrite-java",
    "openrewrite-java-21"
]

slf4j = [
    "slf4j-simple",
    "slf4j-api",
]
springboot = [
    "spring-boot-web",
    "spring-boot-autoconfigure",
    "spring-boot-actuator",
]

# TestingCatalog bundles
testingCatalog-cibseven = [
    "testingCatalog-cibseven-assert",
    "testingCatalog-cibseven-junit5",
]
testingCatalog-integrationtest = [
    "testingCatalog-spring-boot-test",
    "testingCatalog-spring-security-test",
    "testingCatalog-mockk",
    "testingCatalog-springmockk",
    "testingCatalog-kotest-assertions-core",
    "testingCatalog-kotest-assertions-json",
]
testingCatalog-unittest = [
    "testingCatalog-junit5",
    "testingCatalog-mockk",
    "testingCatalog-kotest-assertions-core",
    "testingCatalog-kotest-assertions-json",
]
testingCatalog-xmlunit = [
    "testingCatalog-xmlunit-core",
    "testingCatalog-xmlunit-assertj",
]

[plugins]

kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlinVersion" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinVersion" }
node = { id = "com.github.node-gradle.node", version.ref = "nodeVersion" }
openrewrite = { id = "org.openrewrite.rewrite", version.ref = "openrewriteBaseVersion" }
springboot = { id = "org.springframework.boot", version.ref = "springBootVersion" }

[versions]

# Versions for A12 components
a12DataServicesVersion = "39.1.1"
a12KernelVersion = "31.3.1"
a12UaaVersion = "10.1.1"
a12UtilsConnectorVersion = "9.0.4"

# Versions for other libraries
activationVersion = "1.1.1"
apacheLoggingVersion = "2.24.3"
cibsevenH2Version = "2.3.232"
cibsevenVersion = "2.2.0"
commonsCliVersion = "1.9.0"
commonsCompressVersion = "1.27.1"
commonsCsvVersion = "1.14.0"
commonsIoVersion = "2.19.0"
commonsLang3Version = "3.17.0"
commonsMath3Version = "3.6.1"
graalJsVersion = "25.0.3"
groovyVersion = "3.0.25"
hibernateVersion = "8.0.2.Final"
jacksonVersion = "3.2.4"
jackson2Version = "2.22.4"
jacksonAnnotationsVersion = "2.22"
jaxbVersion = "4.0.5"
jaxbApiVersion = "4.0.2"
jaxenVersion = "2.0.0"
jaxwsVersion = "4.0.3"
jdomVersion = "2.0.6.1"
jimFsVersion = "1.2"
jsonVersion = "20250107"
jsonPathVersion = "2.9.0"
kotlinVersion = "2.3.0"
kotlinterVersion = "5.0.2"
kotlinCoroutinesVersion = "1.10.2"
nettyVersion = "4.2.1.Final"
nodeVersion = "7.1.0"
openapiExtVersion = "0.18.2"
openrewriteVersion = "8.86.0"
openrewriteBaseVersion = "7.37.0"
postgresVersion = "42.7.5"
slf4jVersion = "2.0.17"
snakeyamlVersion = "2.4"
springVersion = "7.0.9"
springBootVersion = "4.1.1"
springRestDocsVersion = "3.0.1"
springSecurityVersion = "7.1.1"
vertxVersion = "4.5.14"
xmlBindVersion = "4.0.2"

# Versions for test libraries
awaitilityVersion = "4.3.0"
junitVersion = "6.0.1"
junitPlatformVersion = "1.12.2"
kotestVersion = "5.9.1"
mockkVersion = "1.14.2"
springmockkVersion = "4.0.2"
testcontainersVersion = "2.0.2"
xmlunitVersion = "2.10.0"

[libraries]

# A12 libraries
a12-dataservices-client-autoconfig = { group = "com.mgmtp.a12.dataservices", name = "dataservices-client-spring-boot-autoconfigure", version.ref = "a12DataServicesVersion" }
a12-dataservices-core = { group = "com.mgmtp.a12.dataservices", name = "dataservices-core", version.ref = "a12DataServicesVersion" }
a12-dataservices-core-autoconfig = { group = "com.mgmtp.a12.dataservices", name = "dataservices-core-spring-boot-autoconfigure", version.ref = "a12DataServicesVersion" }
a12-dataservices-domain = { group = "com.mgmtp.a12.dataservices", name = "dataservices-domain", version.ref = "a12DataServicesVersion" }
a12-dataservices-server-app = { group = "com.mgmtp.a12.dataservices", name = "dataservices-server-app", version.ref = "a12DataServicesVersion" }
a12-dataservices-server-autoconfig = { group = "com.mgmtp.a12.dataservices", name = "dataservices-server-spring-boot-autoconfigure", version.ref = "a12DataServicesVersion" }

a12-kernel-conversion-java = { group = "com.mgmtp.a12.kernel", name = "kernel-conversion-java", version.ref = "a12KernelVersion" }

a12-rest-server-connector-autoconfig = { group = "com.mgmtp.a12.utils", name = "utils-rest-server-connector-spring-boot-autoconfigure", version.ref = "a12UtilsConnectorVersion" }

a12-uaa-authentication = { group = "com.mgmtp.a12.uaa", name = "uaa-authentication", version.ref = "a12UaaVersion" }
