vulnerabilityOverrides-snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyamlVersion" }    # CVE-2022-25857 1.30 -> 1.31, CVE-2022-38752 1.31 -> 1.33, CVE-2022-1471 1.33 -> 2.2

