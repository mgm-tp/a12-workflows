cibseven-starter-rest = { group = "org.cibseven.bpm.springboot", name = "cibseven-bpm-spring-boot-starter-rest-4", version.ref = "cibsevenVersion" }
cibseven-starter-webapp = { group = "org.cibseven.bpm.springboot", name = "cibseven-bpm-spring-boot-starter-webapp-4", version.ref = "cibsevenVersion" }
